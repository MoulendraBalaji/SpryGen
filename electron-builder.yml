appId: com.sprygen.desktop
productName: Sprygen
copyright: Copyright © 2026 Sprygen Team
directories:
  output: release
files:
  - dist
  - dist-electron
  - package.json
  - backend/**
  - "!backend/__pycache__/**"
  - "!backend/**/__pycache__/**"
  - "!backend/dist/**"
  - "!backend/build/**"
  - "!backend/*.spec"
  - "!**/*.pyc"
asar: true
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - requirements.txt
      - providers.json
      - "dist/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.productivity
  artifactName: Sprygen-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: Sprygen-${version}-${os}-${arch}.${ext}
  icon: build/icon.ico
linux:
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  category: Utility
  maintainer: Sprygen Team
  artifactName: Sprygen-${version}-${os}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
