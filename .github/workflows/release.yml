name: Build & Release SPRYGEN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Vite
        run: npm run build

  build:
    needs: checks
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: package:win
          - name: macos
            os: macos-latest
            script: package:mac
          - name: linux
            os: ubuntu-latest
            script: package:linux
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Package app
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Rename Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Get-ChildItem release -Filter *.exe | Where-Object { $_.Name -match 'nsis' } | ForEach-Object { Rename-Item $_.FullName 'SPRYGEN-Windows-installer.exe' }

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -f release/Sprygen-* artifacts/ 2>/dev/null || true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true