name: Build & Release SPRYGEN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Released binaries must not ship unless the full CI matrix passed for this
  # commit. This calls the same reusable workflow used by push/PR CI.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: package:win
          - name: macos
            os: macos-latest
            script: package:mac
          - name: linux
            os: ubuntu-latest
            script: package:linux
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-voice-core.txt

      - name: Install Dependencies
        run: npm ci

      # Assets must be named after the tag that triggered the build (the
      # package.json version only changes on release cuts).
      - name: Sync package.json version with the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install Python build deps
        run: pip install -r backend/requirements.txt -r backend/requirements-voice-core.txt pyinstaller

      - name: Build frozen Python backend
        run: npm run backend:build

      # Guard: the packaged app must actually ship the voice stack, otherwise the
      # installed app's mic toggle fails with ENGINE_FAILURE.
      - name: Verify packaged voice engine
        run: node scripts/verify-sidecar-voice.mjs backend/dist/sprygen-backend

      - name: Package app
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -f release/Sprygen-*.exe artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.dmg artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.deb artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.AppImage artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.blockmap artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.zip artifacts/ 2>/dev/null || true
          cp -f release/Sprygen-*.tar.gz artifacts/ 2>/dev/null || true

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true